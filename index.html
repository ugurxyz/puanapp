<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Takip">
<title>Çalışma Takibi</title>
<link rel="stylesheet" href="ortak.css">
<style>
  .kart {
    display: block; margin-top: 12px; padding: 16px; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  }
  .kart:active { background: #20242d; }
  .kart .b { display: flex; justify-content: space-between; align-items: center; font-size: 17px; font-weight: 600; }
  .kart .b span:last-child { color: #555; }
  .kart .a { margin-top: 8px; font-size: 14px; color: #aaa; line-height: 1.5; }
  .kart .a b { color: #fff; }
  .yedek p { margin: 0 0 8px; font-size: 13px; color: #aaa; line-height: 1.5; }
  .yedek .btns { margin-top: 8px; }
  .yedek .btns button { flex: 1; }
</style>
</head>
<body>
<div class="card">
  <h1>Çalışma Takibi</h1>

  <a class="kart" href="page1.html">
    <div class="b"><span>📊 Performans</span><span>›</span></div>
    <div class="a" id="o1"></div>
  </a>
  <a class="kart" href="page2.html">
    <div class="b"><span>📝 Deneme</span><span>›</span></div>
    <div class="a" id="o2"></div>
  </a>
  <a class="kart" href="page3.html">
    <div class="b"><span>📚 Ders ve Konu</span><span>›</span></div>
    <div class="a" id="o3"></div>
  </a>

  <a class="kart" href="page4.html">
    <div class="b"><span>🎬 Video Özeti</span><span>›</span></div>
    <div class="a" id="o4"></div>
  </a>

  <h2>Yedek</h2>
  <div class="panel yedek">
    <p>Veriler bu tarayıcıda saklanır. Tarayıcı verisi temizlenirse veya başka cihaza geçersen kaybolur. Düzenli yedek al.</p>
    <div class="btns">
      <button class="mavi" id="indir">Dosya olarak indir</button>
      <button class="gri" id="kopyala">Kopyala</button>
    </div>

    <label for="dosya" style="margin-top:16px">Yedekten yükle</label>
    <input id="dosya" type="file" accept=".json,application/json" style="font-size:14px;color:#aaa">
    <textarea id="yedekMetin" placeholder="Yedek metnini buraya yapıştır veya yukarıdan dosya seç" style="margin-top:8px"></textarea>
    <button class="ana" id="yukle" style="margin-top:8px;background:#2a2e38;color:#ddd">Yedeği İçe Aktar</button>
    <div id="durum" class="durum"></div>
  </div>
</div>

<script src="ortak.js"></script>
<script>
  navCiz('index');

  function ozet() {
    const P = perfOku(), D = diziOku(ANAHTAR.deneme), S = diziOku(ANAHTAR.ders);

    // performans
    if (P.length) {
      const son7 = P.slice(-7);
      const ort = Math.round(son7.reduce((a, k) => a + k.sonuc, 0) / son7.length);
      $('o1').innerHTML = `Son sonuç: <b>${P[P.length - 1].sonuc}</b> · son ${son7.length} kayıt ort. <b>${ort}</b><br>` +
        `Hafta ${Math.floor((P.length - 1) / 7) + 1} · ${P.length} kayıt`;
    } else $('o1').textContent = 'Henüz kayıt yok';

    // deneme
    const net = t => { const x = D.filter(k => k.tur === t); return x.length ? x[x.length - 1].net : null; };
    const tn = net('TYT'), an = net('AYT');
    $('o2').innerHTML = D.length
      ? `Son TYT net: <b>${tn == null ? '—' : Number(tn.toFixed(2))}</b> · son AYT net: <b>${an == null ? '—' : Number(an.toFixed(2))}</b><br>${D.length} deneme`
      : 'Henüz deneme yok';

    // ders / konu
    if (S.length) {
      const son = S[S.length - 1].gun || 1;
      const gunDk = S.filter(k => k.gun === son).reduce((a, k) => a + (k.dk || 0), 0);
      const top = S.reduce((a, k) => a + (k.dk || 0), 0);
      $('o3').innerHTML = `Gün ${son}: <b>${fmtSure(gunDk)}</b> · toplam <b>${fmtSure(top)}</b><br>Son konu: ${esc(S[S.length - 1].ders)} · ${esc(S[S.length - 1].konu)}`;
    } else $('o3').textContent = 'Henüz kayıt yok';

    // video özetleri
    const O = diziOku(ANAHTAR.ozet);
    $('o4').innerHTML = O.length
      ? `<b>${O.length}</b> özet<br>Son: ${esc(O[O.length - 1].baslik)}`
      : 'YouTube linkini yapıştır, özetini al';
  }

  // ---- Yedek ----
  function yedekMetni() {
    return JSON.stringify({
      surum: 1,
      perf: perfOku(),
      deneme: diziOku(ANAHTAR.deneme),
      ders: diziOku(ANAHTAR.ders),
      ozet: diziOku(ANAHTAR.ozet)
    }, null, 1);
  }

  $('indir').addEventListener('click', () => {
    const blob = new Blob([yedekMetni()], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'takip-yedek.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    $('durum').textContent = 'Yedek dosyası indirildi';
  });

  $('kopyala').addEventListener('click', async () => {
    const m = yedekMetni();
    $('yedekMetin').value = m;
    try {
      await navigator.clipboard.writeText(m);
      $('durum').textContent = 'Yedek panoya kopyalandı (kutuda da duruyor)';
    } catch (e) {
      $('yedekMetin').select();
      $('durum').textContent = 'Kutudaki metni elle kopyala';
    }
  });

  $('dosya').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => { $('yedekMetin').value = r.result; $('durum').textContent = 'Dosya okundu, İçe Aktar\'a bas'; };
    r.readAsText(f);
  });

  $('yukle').addEventListener('click', () => {
    let d;
    try { d = JSON.parse($('yedekMetin').value); } catch (e) { $('durum').textContent = 'Geçersiz yedek metni'; return; }
    if (!d || !Array.isArray(d.perf) || !Array.isArray(d.deneme) || !Array.isArray(d.ders)) {
      $('durum').textContent = 'Yedek biçimi hatalı'; return;
    }
    const temiz = a => a.filter(k => k && typeof k === 'object');
    const p = temiz(d.perf), de = temiz(d.deneme), ds = temiz(d.ders);
    const oz = Array.isArray(d.ozet) ? temiz(d.ozet) : null; // eski yedeklerde olmayabilir
    if (!confirm('Mevcut veriler silinip yedektekiler yüklenecek.\nPerformans: ' + p.length + ', Deneme: ' + de.length + ', Ders: ' + ds.length + ' kayıt.\nDevam edilsin mi?')) return;
    yaz(ANAHTAR.perf, p);
    yaz(ANAHTAR.deneme, de);
    yaz(ANAHTAR.ders, ds);
    if (oz) yaz(ANAHTAR.ozet, oz);
    $('durum').textContent = 'Yedek yüklendi';
    ozet();
  });

  ozet();
</script>
</body>
</html>
